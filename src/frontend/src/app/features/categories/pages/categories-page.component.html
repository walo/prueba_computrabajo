<div class="space-y-6">
  <ad-card
    title="Catálogo de Categorías"
    subtitle="Administra la clasificación del inventario de productos"
    padding="lg">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full md:max-w-xl">
        <ad-search-box
          placeholder="Buscar por código o nombre..."
          [value]="searchQuery()"
          [loading]="isLoading()"
          (search)="onSearchChange($event)"
          (cleared)="onSearchChange('')" />

        <ad-select
          placeholder="Estado"
          [options]="statusOptions"
          [ngModel]="statusFilter()"
          (ngModelChange)="onStatusFilterChange($event)" />
      </div>

      <ad-button
        *ngxPermissionsOnly="[permissions.CATEGORIES.CREATE]"
        variant="primary"
        (clicked)="openCreateModal()">
        <ad-icon name="plus" size="sm" class="mr-2" />
        Nueva categoría
      </ad-button>
    </div>

    <ad-table
      [columns]="columns"
      [data]="$any(items())"
      [loading]="isLoading()"
      [totalItems]="totalCount()"
      [page]="pageIndex()"
      [pageSize]="pageSize()"
      emptyTitle="Sin categorías registradas"
      emptyDescription="Aún no existen categorías que coincidan con tu búsqueda."
      (pageChange)="onPageChange($event)">
      <ng-template adTableCell="code" let-row>
        <span class="font-mono text-xs font-medium text-primary bg-surface-muted px-2 py-1 rounded-ad-sm">
          {{ row.code }}
        </span>
      </ng-template>

      <ng-template adTableCell="description" let-row>
        <span class="text-foreground-muted">
          {{ row.description || '—' }}
        </span>
      </ng-template>

      <ng-template adTableCell="isActive" let-row>
        <ad-badge
          [variant]="row.isActive ? 'success' : 'neutral'"
          [dot]="true"
          size="sm">
          {{ row.isActive ? 'Activa' : 'Inactiva' }}
        </ad-badge>
      </ng-template>

      <ng-template adTableCell="actions" let-row>
        <ad-table-actions
          *ngxPermissionsOnly="[permissions.CATEGORIES.UPDATE, permissions.CATEGORIES.DELETE]"
          [actions]="rowActions()"
          [row]="row"
          (actionClick)="handleRowAction($event)" />
      </ng-template>
    </ad-table>
  </ad-card>

  <ad-modal
    [isOpen]="isModalOpen()"
    [title]="editingCategory() ? 'Editar Categoría' : 'Nueva Categoría'"
    [description]="
      editingCategory()
        ? 'Actualiza el código, nombre, descripción o estado de la categoría.'
        : 'Registra una nueva categoría para clasificar los productos.'
    "
    size="md"
    (isOpenChange)="onModalOpenChange($event)"
    (closed)="closeModal()">
    <form [formGroup]="categoryForm" (ngSubmit)="submitForm()" class="space-y-4">
      <ad-input
        label="Código"
        placeholder="Ej. elec-01"
        formControlName="code"
        [required]="true"
        hint="Entre 2 y 30 caracteres alfanuméricos o guiones sin espacios."
        [errorMessages]="{
          required: 'El código es obligatorio.',
          minlength: 'Mínimo 2 caracteres.',
          maxlength: 'Máximo 30 caracteres.',
          pattern: 'Solo letras, números y guiones.'
        }" />

      <ad-input
        label="Nombre"
        placeholder="Ej. Electrónica"
        formControlName="name"
        [required]="true"
        [errorMessages]="{
          required: 'El nombre es obligatorio.',
          minlength: 'Mínimo 2 caracteres.',
          maxlength: 'Máximo 100 caracteres.'
        }" />

      <ad-textarea
        label="Descripción"
        placeholder="Describe el tipo de productos agrupados (opcional)"
        formControlName="description"
        [maxLength]="500"
        [showCount]="true"
        [errorMessages]="{
          maxlength: 'Máximo 500 caracteres.'
        }" />

      @if (editingCategory()) {
        <div class="pt-2">
          <ad-switch
            label="Categoría activa"
            description="Permite asociar nuevos productos a esta categoría"
            formControlName="isActive" />
        </div>
      }
    </form>

    <div modal-footer class="flex items-center justify-end gap-3">
      <ad-button
        variant="ghost"
        [disabled]="isSubmitting()"
        (clicked)="closeModal()">
        Cancelar
      </ad-button>
      <ad-button
        variant="primary"
        [loading]="isSubmitting()"
        [disabled]="categoryForm.invalid || isSubmitting()"
        (clicked)="submitForm()">
        {{ editingCategory() ? 'Guardar cambios' : 'Crear categoría' }}
      </ad-button>
    </div>
  </ad-modal>
</div>
