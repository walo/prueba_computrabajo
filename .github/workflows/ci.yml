name: Enterprise CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-dotnet:
    name: .NET 10 Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore EnterpriseApp.sln

      - name: Build solution
        run: dotnet build EnterpriseApp.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test EnterpriseApp.sln --configuration Release --no-build --verbosity normal

  frontend-angular:
    name: Angular 22 Jest & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Jest unit tests
        run: npm run test:ci

      - name: Build Angular application
        run: npm run build
